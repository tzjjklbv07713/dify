      - data:
          code: |
            import json
            import re

            def _loads_maybe(value):
                if isinstance(value, dict):
                    return value
                text = (value or "").strip()
                if not text:
                    return {}
                if text.startswith("```"):
                    text = re.sub(r"^```(?:json)?\s*", "", text)
                    text = re.sub(r"\s*```$", "", text)
                return json.loads(text)

            def main(
                variant_id: str,
                scene_group: str,
                product_count_range: str,
                use_case: str,
                difference_focus: str,
                prompt: str,
                response_body: str,
            ) -> dict:
                payload = _loads_maybe(response_body)
                first_item = (payload.get("data") or [{}])[0] or {}
                result = {
                    "variant_id": variant_id,
                    "scene_group": scene_group,
                    "product_count_range": product_count_range,
                    "use_case": use_case,
                    "difference_focus": difference_focus,
                    "prompt": prompt,
                    "image_url": first_item.get("url", ""),
                    "image_b64_available": bool(first_item.get("b64_json")),
                    "revised_prompt": first_item.get("revised_prompt", ""),
                }
                return {
                    "result": result,
                }
          code_language: python3
          desc: 解析每条变体的参考图结果，返回结构化验证信息。
          isInIteration: true
          iteration_id: iteration_reference_images
