app:
  description: 4-step image-prompt workflow for Lizhuo Supermarket summer poster generation, variant prompt generation, reference-image generation, and prompt templating.
  icon: "🥤"
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: lizhuo_summer_poster_workflow
  use_icon_as_answer_icon: false
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/openai:0.2.5@373362a028986aae53a7baf73a7f11991ba3c22c69eaf97d6cde048cfd4a9f98
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables:
    - id: env-image-api-url
      name: IMAGE_API_URL
      value: https://api.openai.com/v1/images/generations
      value_type: string
      description: HTTP endpoint for image generation. Default is the OpenAI Images API.
    - id: env-image-api-key
      name: IMAGE_API_KEY
      value: CHANGE_ME
      value_type: secret
      description: API key used by the HTTP image-generation steps.
  features:
    file_upload:
      allowed_file_extensions:
        - .JPG
        - .JPEG
        - .PNG
        - .GIF
        - .WEBP
        - .SVG
      allowed_file_types:
        - image
      allowed_file_upload_methods:
        - local_file
        - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
          - local_file
          - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: start
          targetType: llm
        id: start-to-llm-master
        source: start_node
        sourceHandle: source
        target: llm_master_prompt
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: code
        id: llm-master-to-parse-master
        source: llm_master_prompt
        sourceHandle: source
        target: code_parse_master_prompt
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: code
        id: parse-master-to-prepare-master-image
        source: code_parse_master_prompt
        sourceHandle: source
        target: code_prepare_master_image
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: http-request
        id: prepare-master-image-to-http
        source: code_prepare_master_image
        sourceHandle: source
        target: http_master_image
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: http-request
          targetType: code
        id: http-master-image-to-parse
        source: http_master_image
        sourceHandle: source
        target: code_parse_master_image
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: llm
        id: parse-master-to-llm-variants
        source: code_parse_master_prompt
        sourceHandle: source
        target: llm_variant_prompts
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: code
        id: llm-variants-to-parse
        source: llm_variant_prompts
        sourceHandle: source
        target: code_parse_variants
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: iteration
        id: parse-variants-to-iteration
        source: code_parse_variants
        sourceHandle: source
        target: iteration_reference_images
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: true
          isInLoop: false
          iteration_id: iteration_reference_images
          sourceType: iteration-start
          targetType: code
        id: iteration-start-to-code-prepare-variant
        source: iteration_reference_imagesstart
        sourceHandle: source
        target: code_prepare_variant_image
        targetHandle: target
        type: custom
        zIndex: 1002
      - data:
          isInIteration: true
          isInLoop: false
          iteration_id: iteration_reference_images
          sourceType: code
          targetType: http-request
        id: code-prepare-variant-to-http
        source: code_prepare_variant_image
        sourceHandle: source
        target: http_variant_image
        targetHandle: target
        type: custom
        zIndex: 1002
      - data:
