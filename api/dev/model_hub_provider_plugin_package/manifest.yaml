version: 0.1.5
type: plugin
author: "your-company"
name: "model-hub-provider"
description:
  en_US: Custom model provider for a third-party proxy that aggregates multiple upstream model vendors.
  zh_Hans: 自定义第三方模型中转，聚合多个上游模型厂商。
label:
  en_US: "Model Hub Provider"
  zh_Hans: "Model Hub Provider"
created_at: "2026-07-07T00:20:00Z"
icon: model-hub-icon.svg
resource:
  memory: 268435456
  permission:
    model:
      enabled: true
      llm: true
      text_embedding: true
      rerank: true
      speech2text: true
      tts: true
plugins:
  models:
    - "provider/model_hub.yaml"
meta:
  version: 0.0.1
  arch:
    - "amd64"
    - "arm64"
  runner:
    language: "python"
    version: "3.12"
    entrypoint: "main"
